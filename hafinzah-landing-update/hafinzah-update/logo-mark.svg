<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- soft base -->
  <rect width="48" height="48" rx="14" fill="currentColor"/>
  <!-- printer body -->
  <rect x="10" y="16" width="28" height="20" rx="3.5" fill="#fff"/>
  <!-- top lid / paper feed -->
  <path d="M14 16V11.5c0-1.9 1.5-3.5 3.5-3.5h13c1.9 0 3.5 1.6 3.5 3.5V16"
        stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- output paper -->
  <rect x="14.5" y="25" width="19" height="8" rx="1.5" fill="currentColor" opacity=".92"/>
  <!-- paper lines -->
  <path d="M17 28h13.5M17 31h9" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- status button -->
  <circle cx="33" cy="20.5" r="1.8" fill="currentColor"/>
</svg>
